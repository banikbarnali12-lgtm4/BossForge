name: Build BossForge

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.14.3'

      - name: Extract project
        run: |
          unzip -q BossForge-Project.zip -d source
          test -f source/BossForge/build.gradle.kts

      - name: Build plugin
        working-directory: source/BossForge
        run: gradle --no-daemon clean build

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: BossForge-JAR
          path: source/BossForge/build/libs/BossForge-1.0.0.jar
          if-no-files-found: error
